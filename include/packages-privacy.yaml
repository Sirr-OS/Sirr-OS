# ------------------------------------
# Configuration Dnscrypt-proxy
# ------------------------------------
  - action: run
    chroot: true
    command: |
      useradd -r -s /usr/sbin/nologin -d /var/lib/dnscrypt-proxy dnscrypt

  - action: run
    chroot: true
    command: |
      mkdir -p /etc/systemd/system/dnscrypt-proxy.service.d
      cat > /etc/systemd/system/dnscrypt-proxy.service.d/override.conf <<EOF
      [Service]
      User=dnscrypt
      Group=dnscrypt
      CapabilityBoundingSet=CAP_NET_BIND_SERVICE
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      NoNewPrivileges=yes
      ProtectSystem=full
      ProtectHome=true
      PrivateTmp=true
      PrivateDevices=true
      ProtectKernelTunables=true
      ProtectControlGroups=true
      ReadWritePaths=/var/cache/dnscrypt-proxy
      EOF


  - action: run
    chroot: true
    command: |
      # Pinned SHA-256: the build fails if the release asset changes
      set -e
      wget -q -O /tmp/privacy-conf_v1.1.0_all.deb https://github.com/Sirr-OS/privacy-conf/releases/download/v1.1.0/privacy-conf_v1.1.0_all.deb
      echo "2158fcc34aabe4043afc32aa43b5b63ea48ade91dfce9585cab9fee10385e47a  /tmp/privacy-conf_v1.1.0_all.deb" | sha256sum -c -
      dpkg -i /tmp/privacy-conf_v1.1.0_all.deb
      rm -f /tmp/privacy-conf_v1.1.0_all.deb

