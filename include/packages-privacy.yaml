{{- $architecture := or .architecture "arm64" -}}

architecture: {{ $architecture }}

actions:
  - action: apt
    recommends: true
    description: Install Privacy packages
    packages:
      - tor
      - torsocks
      - carburetor
      - dnscrypt-proxy
      - proxychains
      - macchanger
      - keepassxc
      - seahorse
      - cryptsetup
      - thunderbird
      - gnupg
      - mat2
      - onionshare
      - nftables
#      - opensnitch ## Good firewall GUI but can cause some crashes.
      - gtkhash


  - action: run
    chroot: true
    command: |
      apt-get update
      apt-get install -y extrepo
      extrepo enable librewolf
      apt-get update
      apt-get install -y librewolf

  - action: run
    chroot: true
    command: |
      # Pinned SHA-256: the build fails if the release asset changes
      set -e
      wget -q -O /tmp/atinout_0.9.1_arm64.deb https://github.com/commander-Z3R0/atinout/releases/download/V0.9.1/atinout_0.9.1_arm64.deb
      echo "f0f7cf9e58114be2c440d220f2952be6ba6e56400fad0f1cd939221032dbebe1  /tmp/atinout_0.9.1_arm64.deb" | sha256sum -c -
      dpkg -i /tmp/atinout_0.9.1_arm64.deb
      rm -f /tmp/atinout_0.9.1_arm64.deb

