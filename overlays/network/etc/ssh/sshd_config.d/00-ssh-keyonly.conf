# SirrOS: SSH with public key authentication only (~/.ssh/authorized_keys)
# sshd uses the first value it reads; the 00- prefix makes this win over other drop-ins.
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
