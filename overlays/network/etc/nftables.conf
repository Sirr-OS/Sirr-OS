#!/usr/sbin/nft -f
# SirrOS: drop all inbound traffic except replies to our own connections
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state invalid drop
    ct state established,related accept
    iif lo accept
    # IPv6 needs these ICMPv6 types to work
    icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, packet-too-big, destination-unreachable, time-exceeded, parameter-problem } accept
    icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
    # DHCP replies (broadcast, not matched by conntrack)
    udp dport 68 accept
    udp dport 546 accept
    # SSH (key-only, see /etc/ssh/sshd_config.d/00-ssh-keyonly.conf)
    tcp dport 22 accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
  chain output {
    type filter hook output priority 0; policy accept;
  }
}
